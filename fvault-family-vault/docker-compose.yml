version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: fvault-family-vault_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/patriotcrypto/family-vault:0.2.0@sha256:627ca32bebd5676ef06545beffd7d9632997b7d4908ead1811671d75385338d6
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
