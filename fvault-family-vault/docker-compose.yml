version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: fvault-family-vault_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/patriotcrypto/family-vault:0.4.0@sha256:6d8c72fa2cf2a12154602037019986c54f1f027dc248a0abf4d26e3996cbedfe
    restart: on-failure
    stop_grace_period: 1m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
