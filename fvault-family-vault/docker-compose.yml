version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: fvault-family-vault_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/patriotcrypto/family-vault:0.4.1@sha256:27f12839545f8eaa30c662d76026a91348d720a2b7a6c863bb06ec47fb49c2de
    restart: on-failure
    stop_grace_period: 1m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
