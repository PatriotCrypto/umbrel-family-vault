version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: fvault-family-vault_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/patriotcrypto/family-vault:0.1.1@sha256:8d4009202846dc992d935dc3f6325e1933ab0e264b4861c156f9fd7e6720c6e8
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
