<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Vault</title>
<link rel="icon" href="icon.svg">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('fv-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gate" class="gate hidden"></div>
<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><img src="icon.svg" alt=""><span>Family Vault</span></div>
    <nav id="nav"></nav>
    <div class="side-foot"><button id="lock-btn">🔒 Lock vault</button></div>
  </aside>
  <main class="main">
    <header class="bar">
      <button id="menu" class="ghost menu" aria-label="Menu">&#9776;</button>
      <input id="search" type="search" placeholder="Search documents, people, contacts…" autocomplete="off">
      <button id="add-btn" class="primary">+ Add</button>
    </header>
    <section id="view"></section>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status"></div>
<input id="picker" type="file" multiple class="hidden">
<input id="photopicker" type="file" accept="image/*" class="hidden">
<script src="app.js"></script>
</body>
</html>
